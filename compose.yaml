services:
  app:
    image: ${BUGFLOW_IMAGE:-bugflow/web:latest}
    build:
      context: .
      target: runtime
    init: true
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      BUGFLOW_DB: /data/bugflow.db
      APP_ORIGIN: "bugflow.devworxsd.com"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
    ports:
      - target: 3000
        published: 8083
        mode: host
    volumes:
      - bugflow-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s

volumes:
  bugflow-data:
