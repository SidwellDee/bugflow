services:
  app:
    image: ${BUGFLOW_IMAGE:-bugflow/web:latest}
    build:
      context: .
      target: runtime
    init: true
    restart: unless-stopped
    env_file:
      - ${BUGFLOW_ENV_FILE:-.env}
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      BUGFLOW_DB: /data/bugflow.db
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN in the environment file}
    ports:
      - "${BUGFLOW_BIND_IP:-127.0.0.1}:${BUGFLOW_HTTP_PORT:-3000}:3000"
    volumes:
      - bugflow-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s

volumes:
  bugflow-data:
